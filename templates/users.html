{% extends "base.html" %}

{% block content %}
<div class="container-fluid p-3 p-lg-4 d-flex flex-column gap-3" style="max-width:1100px;">

    <!-- Поиск и действия -->
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-3 p-lg-4 d-flex flex-column gap-3">

            <form id="userSearchForm" class="d-flex gap-2 flex-wrap" role="search">
                <input id="userSearchInput" class="form-control" type="search"
                       placeholder="Поиск по логину"
                       aria-label="Поиск по пользователям"
                       autocomplete="off"
                       value="{{ usersQuery }}">
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary" type="button" id="userSearchReset">Сбросить</button>
                    <button class="btn btn-outline-primary" type="submit">
                        <i class="bi bi-search me-1"></i>Найти
                    </button>
                </div>
            </form>

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div class="text-body-secondary small">
                    Показано <span id="usersShown" class="fw-semibold text-body">{{ users | length }}</span>
                    из <span id="usersTotal" class="fw-semibold text-body">{{ allUsers | length }}</span>
                    {% if usersQuery %}
                    <span class="badge text-bg-light border ms-2">фильтр: {{ usersQuery }}</span>
                    {% endif %}
                </div>

                <button class="btn btn-outline-secondary btn-sm" type="button" id="usersRefresh"
                        title="Обновить список">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>

        </div>
    </div>

    <!-- Список пользователей -->
    <div id="userListWrap">
        {% include "components/users_list.html" %}
    </div>

</div>
{% endblock %}
