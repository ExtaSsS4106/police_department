{% extends "base.html" %}

{% block content %}
<main class="flex-grow-1 overflow-hidden" style="min-height: 70vh;">
    <div class="container-fluid p-3 p-lg-4 d-flex flex-column gap-3" style="max-width:1100px;">

        <div class="d-flex gap-1 flex-column px-4 py-4 card border-0 shadow-sm rounded-4" style="min-height: 100px;">
            <div class="d-flex" role="search">
                <input id="search-input" class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                <button class="btn btn-outline-success" type="submit">Search</button>
            </div>
            <div class="d-flex flex-wrap">
                <div class="dropdown">
                    <button id="btn-stack" class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Все
                    </button>
                    <ul id="btns-stack" class="dropdown-menu">
                        <li><button data-stack-type="all" class="dropdown-item" type="button">Все</button></li>
                        <li><button data-stack-type="mobile" class="dropdown-item" type="button">Мобилки</button></li>
                        <li><button data-stack-type="server" class="dropdown-item" type="button">Сервер</button></li>
                        <li><button data-stack-type="desctop" class="dropdown-item" type="button">Десктоп</button></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-header bg-transparent border-bottom d-flex justify-content-between align-items-center">
                <h2 class="h6 fw-bold mb-0">
                    <i class="bi bi-link-45deg me-2 text-primary"></i>Ссылки
                </h2>
            </div>
            <div class="col">
                <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
                    <img src="/media/cars/example.jpg" alt="Toyota Camry" class="w-100 object-fit-cover bg-secondary-subtle" style="aspect-ratio:16/10;">

                    <div class="card-body">

                        <h3 class="h6 fw-bold mb-1">Toyota Camry</h3>
                        <div class="text-body-secondary small mb-2">VIN JTNB11HK103000001</div>
                        <div class="d-flex flex-wrap gap-2">
                            <span class="badge text-bg-secondary">2021</span>
                            <span class="badge text-bg-light border">Чёрный</span>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent border-0 pt-0 pb-3 d-flex gap-2">
                        <button class="btn btn-sm btn-outline-primary flex-grow-1" type="button" data-bs-toggle="modal" data-bs-target="#info-1">
                            <i class="bi bi-info-circle me-1"></i>Инфо
                        </button>
                        <button class="btn btn-sm btn-outline-danger" type="button" data-bs-toggle="modal" data-bs-target="#delete-1" aria-label="Списать">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>
{% endblock %}
